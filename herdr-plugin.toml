id = "bayoudhi.shell-progress"
name = "Shell Progress"
version = "0.5.1"
min_herdr_version = "0.7.0"
description = "Shows progress for slow shell commands, not just agents, in the Herdr TUI and desktop app"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "print-snippet"
title = "Print the shell setup snippet"
contexts = ["workspace"]
command = ["bash", "scripts/print-snippet.sh"]
