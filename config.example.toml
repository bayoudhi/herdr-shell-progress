# Copy to the directory reported by:
#   herdr plugin config-dir bayoudhi.shell-progress
# and rename to config.toml. Every key is optional.

threshold_ms    = 2000  # how long before a command counts as "slow" (floor 250)
tick_ms         = 2000  # elapsed-label refresh interval (floor 250)
max_title_len   = 60    # command line truncation in the title field
max_display_len = 24    # command line truncation in the sidebar row name (floor 8)

# The sidebar row shows the command line as typed — `npm run start`, not `npm` —
# with runs of whitespace collapsed and the tail cut at max_display_len. Keep it
# under Herdr's own ui.sidebar_max_width (36 columns by default): the row also
# spends columns on the state icon and the elapsed label, so a wider cap just
# hands the truncation to Herdr and squeezes the label out. A value below 8 is
# clamped up, so a row can never end up nameless.

# threshold_ms and tick_ms are clamped up to 250 ms. Below that the elapsed
# ticker would connect to the socket hundreds of times a second for the whole
# duration of the command, and no label refreshes usefully that fast anyway.

# Commands never tracked. Matched on the basename of the program name, after
# alias expansion and after skipping VAR=value assignments and the transparent
# wrappers `command`, `builtin`, `exec`, `env`, `nohup`.
# Setting this REPLACES the defaults. Keep the shells: a nested shell inherits
# HERDR_PANE_ID, so it would share this pane's marker and fight the outer
# watcher for the pane's state.
# ignore = ["vim", "nvim", "less", "man", "ssh", "top", "htop",
#           "claude", "codex", "opencode", "droid", "zsh", "bash", "sh", "fish"]

# Added to the defaults instead of replacing them.
ignore_extra = []

[finish]
success_sticky_ms = 20000   # 0 = clear the instant the command finishes
failure_sticky    = true    # false = failures clear like successes

[labels]
running = "running {elapsed}"
success = "ok · {elapsed}"
failure = "exit {code} · {elapsed}"
signal  = "{signal} · {elapsed}"
unknown = "{elapsed}"          # exit code unreadable: elapsed only, never "ok"
